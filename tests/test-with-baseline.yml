name: Test with baseline_path provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a test file with a secret and a baseline
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/baseline-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/baseline-test/secret.py" << 'EOF'
          # This file contains a fake secret for testing
          AWS_SECRET_ACCESS_KEY = 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          EOF
          # Create a minimal valid baseline that detect-secrets can update
          cat > "$GITHUB_WORKSPACE/tests/fixtures/baseline-test/.secrets.baseline" << 'BASELINE'
          {
            "version": "1.4.0",
            "plugins_used": [
              {"name": "AWSKeyDetector"},
              {"name": "ArtifactoryDetector"},
              {"name": "AzureStorageKeyDetector"},
              {"name": "BasicAuthDetector"},
              {"name": "CloudantDetector"},
              {"name": "DiscordBotTokenDetector"},
              {"name": "GitHubTokenDetector"},
              {"name": "HexHighEntropyString", "limit": 3.0},
              {"name": "IbmCloudIamDetector"},
              {"name": "IbmCosHmacDetector"},
              {"name": "JwtTokenDetector"},
              {"name": "KeywordDetector", "keyword_exclude": ""},
              {"name": "MailchimpDetector"},
              {"name": "NpmDetector"},
              {"name": "PrivateKeyDetector"},
              {"name": "SendGridDetector"},
              {"name": "SlackDetector"},
              {"name": "SoftlayerDetector"},
              {"name": "SquareOAuthDetector"},
              {"name": "StripeDetector"},
              {"name": "TwilioKeyDetector"}
            ],
            "filters_used": [
              {"path": "detect_secrets.filters.allowlist.is_line_allowlisted"},
              {"path": "detect_secrets.filters.common.is_baseline_file", "filename": "tests/fixtures/baseline-test/.secrets.baseline"},
              {"path": "detect_secrets.filters.common.is_ignored_due_to_verification_policies", "min_level": 2},
              {"path": "detect_secrets.filters.heuristic.is_indirect_reference"},
              {"path": "detect_secrets.filters.heuristic.is_likely_id_suffix"},
              {"path": "detect_secrets.filters.heuristic.is_lock_file"},
              {"path": "detect_secrets.filters.heuristic.is_not_alphanumeric_string"},
              {"path": "detect_secrets.filters.heuristic.is_potential_uuid"},
              {"path": "detect_secrets.filters.heuristic.is_prefixed_with_dollar_sign"},
              {"path": "detect_secrets.filters.heuristic.is_sequential_string"},
              {"path": "detect_secrets.filters.heuristic.is_swagger_file"},
              {"path": "detect_secrets.filters.heuristic.is_templated_secret"}
            ],
            "results": {},
            "generated_at": "2024-01-01T00:00:00Z"
          }
          BASELINE
          echo "Baseline content:"
          cat "$GITHUB_WORKSPACE/tests/fixtures/baseline-test/.secrets.baseline"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          workdir: tests/fixtures/baseline-test
          baseline_path: tests/fixtures/baseline-test/.secrets.baseline
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action succeeded with baseline
        run: |
          echo "PASS: action completed successfully using a baseline file"
