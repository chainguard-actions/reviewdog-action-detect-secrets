name: Test with baseline file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a directory and a baseline file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/baseline-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/baseline-test/app.py" << 'EOF'
          # This file intentionally contains fake secrets for testing
          SECRET_KEY = '60b725f10c9c85c70d97880dfe8191b3'
          EOF
          # Create an initial baseline by running detect-secrets scan
          # (detect-secrets may not be installed on the runner, so we create a minimal valid baseline)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/baseline-test/.secrets.baseline" << 'EOF'
          {
            "version": "1.4.0",
            "plugins_used": [],
            "filters_used": [],
            "results": {},
            "generated_at": "2024-01-01T00:00:00Z"
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: error
          workdir: tests/fixtures/baseline-test
          baseline_path: tests/fixtures/baseline-test/.secrets.baseline
          detect_secrets_flags: --all-files --force-use-all-plugins
        continue-on-error: true

      - name: Assert action ran with baseline
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded using baseline file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue with reviewdog reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
