name: Test secret found with fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory containing a fake secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-secret"
          printf 'aws_access_key_id = "AKIAIOSFODNN7EXAMPLE"\n' > "$GITHUB_WORKSPACE/scan-secret/config.ini"
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: scan-secret
          reporter: local
          filter_mode: nofilter
          fail_level: none
      - name: Assert action succeeded despite findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail_level none"
            exit 1
          fi
          echo "PASS"
