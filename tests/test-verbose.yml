name: Test detect-secrets verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run detect-secrets action with verbose output
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          verbose: "true"
          detect_secrets_flags: --all-files --force-use-all-plugins
      - name: Assert action completed successfully
        run: |
          echo "Action completed in verbose mode without error"
          echo "PASS"
