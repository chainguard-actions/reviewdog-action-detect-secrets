name: Test secret found with fail_level error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory containing a fake secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-secret-fail"
          printf 'aws_access_key_id = "AKIAIOSFODNN7EXAMPLE"\n' > "$GITHUB_WORKSPACE/scan-secret-fail/config.ini"
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: scan-secret-fail
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: error
      - name: Assert action failed because a secret was found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is detected with fail_level error"
            exit 1
          fi
          echo "PASS"
