name: Test detect-secrets with secrets present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a secret-like value
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/with-secrets"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/with-secrets/secrets.py" << 'EOF'
          # This file contains a fake secret for testing purposes
          SUPER_SECRET_VALUES = '60b725f10c9c85c70d97880dfe8191b3', '3b5d5c3712955042212316173ccf37be'
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/with-secrets
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action completed successfully with fail_level=none
        run: |
          echo "Action completed - secrets may have been detected but fail_level=none so exit code should be 0"
          echo "PASS: detect-secrets ran successfully even with secrets present (fail_level=none)"
