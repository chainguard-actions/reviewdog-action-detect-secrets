name: Test secrets detected scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a test directory with a file containing secrets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/secrets-dir"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/secrets-dir/config.py" << 'EOF'
          # Application configuration
          AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: error
          workdir: tests/fixtures/secrets-dir
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action ran (detected secrets or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (secrets detected and reported)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo for reviewdog API calls)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
