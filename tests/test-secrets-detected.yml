name: Test detect-secrets finds secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file with secrets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/with-secrets"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/with-secrets/secrets.py" << 'EOF'
          # Will change this later.
          SUPER_SECRET_VALUES = '60b725f10c9c85c70d97880dfe8191b3', '3b5d5c3712955042212316173ccf37be'

          def main():
              print('Hello world!')

          if __name__ == '__main__':
              main()
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/with-secrets
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action ran (fail_level=none means exit 0 even with secrets)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=none even when secrets detected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
