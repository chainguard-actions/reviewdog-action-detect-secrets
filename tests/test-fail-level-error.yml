name: Test fail_level error fails when a secret is found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/secrets
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: error
      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because a secret is present and fail_level=error"
            exit 1
          fi
          echo "PASS"
