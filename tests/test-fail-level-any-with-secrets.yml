name: Test fail_level any fails when secrets are found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/secrets
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action failed because secrets were detected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since fixture contains secrets"
            exit 1
          fi
          echo "PASS"
