name: Test clean directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory without secrets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-clean"
          printf 'hello world\nthis file has no secrets\n' > "$GITHUB_WORKSPACE/scan-clean/readme.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: scan-clean
          reporter: local
          filter_mode: nofilter
          fail_level: error
          verbose: "true"
          skip_audited: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success on a clean directory"
            exit 1
          fi
          echo "PASS"
