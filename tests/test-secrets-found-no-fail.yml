name: Test secrets found with fail_level=none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a test file with a secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/with-secrets"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/with-secrets/secret.py" << 'EOF'
          # This file contains a fake secret for testing
          AWS_SECRET_ACCESS_KEY = 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          workdir: tests/fixtures/with-secrets
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action succeeded despite secrets found
        run: |
          echo "PASS: action completed with exit 0 (fail_level=none) even though secrets were detected"
