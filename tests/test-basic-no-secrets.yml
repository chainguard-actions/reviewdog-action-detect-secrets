name: Test basic usage - no secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a clean directory with no secrets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/hello.py" << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
          fail_level: none
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action completed (no secrets in clean dir)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded on clean directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
