name: Test detect-secrets skip-audited mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run detect-secrets action with skip_audited enabled
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          name: custom-detect-secrets
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          skip_audited: "true"
          detect_secrets_flags: --all-files --force-use-all-plugins
      - name: Assert action completed successfully
        run: |
          echo "Action completed with skip_audited=true without error"
          echo "PASS"
