name: Test detect-secrets with skip_audited and verbose flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a baseline with an audited (verified non-secret) entry
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/audited-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/audited-test/secrets.py" << 'EOF'
          # Will change this later.
          SUPER_SECRET_VALUES = '60b725f10c9c85c70d97880dfe8191b3', '3b5d5c3712955042212316173ccf37be'

          def main():
              print('Hello world!')

          if __name__ == '__main__':
              main()
          EOF
          # Create a baseline with an audited entry (is_secret: false means it was audited and confirmed NOT a secret)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/audited-test/.secrets.baseline" << 'EOF'
          {
            "version": "1.5.0",
            "plugins_used": [
              {"name": "HexHighEntropyString", "hex_limit": 3.0}
            ],
            "filters_used": [],
            "results": {
              "tests/fixtures/audited-test/secrets.py": [
                {
                  "type": "Hex High Entropy String",
                  "filename": "tests/fixtures/audited-test/secrets.py",
                  "hashed_secret": "aabbcc",
                  "is_verified": false,
                  "is_secret": false,
                  "line_number": 2
                }
              ]
            },
            "generated_at": "2024-01-01T00:00:00Z"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/audited-test
          baseline_path: tests/fixtures/audited-test/.secrets.baseline
          reporter: local
          filter_mode: nofilter
          fail_level: none
          skip_audited: "true"
          verbose: "true"
          detect_secrets_flags: --all-files --force-use-all-plugins

      - name: Assert action ran with skip_audited and verbose flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip_audited=true and verbose=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
